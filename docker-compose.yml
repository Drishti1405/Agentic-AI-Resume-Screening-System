version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume_screening_backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - KMP_DUPLICATE_LIB_OK=TRUE
      - OMP_NUM_THREADS=1
    volumes:
      - ./backend/resumes:/app/resumes
      - ./backend/job_descriptions:/app/job_descriptions
      - ./backend/reports:/app/reports
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resume_screening_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
